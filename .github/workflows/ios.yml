name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Ottu.xcodeproj -scheme Ottu

      - name: Run unit tests
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$DEVICE_ID"
          xcodebuild test -project Ottu.xcodeproj -scheme Ottu \
            -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO

      - name: Build for iOS device
        run: >-
          xcodebuild -project Ottu.xcodeproj -scheme Ottu
          -configuration Release -sdk iphoneos
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Ottu.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ottu-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ottu-unsigned-ipa
          path: ottu-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

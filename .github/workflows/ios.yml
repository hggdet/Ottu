name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          candidates=()
          for path in /Applications/Xcode_26*.app /Applications/Xcode.app; do
            [[ -d "$path" ]] || continue
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$path/Contents/Info.plist" 2>/dev/null || true)
            [[ "$version" == 26.* ]] && candidates+=("$path")
          done
          if [[ ${#candidates[@]} -eq 0 ]]; then
            echo 'No Xcode 26 installation was found on this runner.' >&2
            ls -1 /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          last_index=$((${#candidates[@]} - 1))
          XCODE_PATH="${candidates[$last_index]}"
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version | tee xcode-version.txt
          grep -Eq '^Xcode 26\.' xcode-version.txt

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Ottu.xcodeproj -scheme Ottu

      - name: Run unit tests
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$DEVICE_ID"
          xcodebuild test -project Ottu.xcodeproj -scheme Ottu \
            -destination "id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO

      - name: Build for iOS device
        run: >-
          xcodebuild -project Ottu.xcodeproj -scheme Ottu
          -configuration Release -sdk iphoneos
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Ottu.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload wain-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: wain-unsigned-ipa
          path: wain-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

name: Ottu
options:
  bundleIdPrefix: iq.ottu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    revision: 13e41ab3d77ff5113e7e5d4ee87803b1f81f5683
  SwiftGzip:
    url: https://github.com/mihai8804858/swift-gzip
    revision: 97c502f10283dbd80eda534d164b715c9c973d72
targets:
  Ottu:
    type: application
    platform: iOS
    sources:
      - path: Sources/Ottu
    resources:
      - path: Resources
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: SwiftGzip
        product: SwiftGzip
      - target: OttuWidget
        embed: true
    info:
      path: Support/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDisplayName: وين
        CFBundleLocalizations:
          - ar
          - en
          - ku
        NSLocationWhenInUseUsageDescription: يستخدم وين موقعك لعرض مكانك الحالي وإنشاء اتجاهات تبدأ من موقعك.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Support/Ottu.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: iq.ottu.ios
        PRODUCT_NAME: Ottu
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
  OttuWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/OttuWidget
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Support/OttuWidget.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: iq.ottu.ios.widget
        PRODUCT_NAME: OttuWidget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Support/OttuWidget-Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  OttuTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: Ottu
    sources:
      - path: Tests/OttuTests
    dependencies:
      - target: Ottu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: iq.ottu.ios.tests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  Ottu:
    build:
      targets:
        Ottu: all
        OttuWidget: all
        OttuTests: [test]
    test:
      config: Debug
      targets:
        - OttuTests
    run:
      config: Debug
    archive:
      config: Release
